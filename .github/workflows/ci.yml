name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

      - name: Verify and exercise official Linux onefile
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          YTDLP_SMOKE_BINARY: ${{ runner.temp }}/yt-dlp-smoke/yt-dlp_linux
        run: |
          release=$(gh release view --repo yt-dlp/yt-dlp --json tagName --jq .tagName)
          echo "Testing yt-dlp release $release"
          gh release download "$release" --repo yt-dlp/yt-dlp --pattern yt-dlp_linux --pattern SHA2-256SUMS --dir "$(dirname "$YTDLP_SMOKE_BINARY")"
          (cd "$(dirname "$YTDLP_SMOKE_BINARY")" && sha256sum --check --ignore-missing SHA2-256SUMS)
          chmod +x "$YTDLP_SMOKE_BINARY"
          bash scripts/linux-smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - run: >
          docker buildx build
          --cache-from=type=gha
          --cache-to=type=gha,mode=max
          --load
          --tag ytdlp-http-wrapper:local
          .

      - name: Check Compose configuration and tmpfs containment
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps -T --entrypoint /bin/sh ytdlp -eu < scripts/container-smoke.sh
