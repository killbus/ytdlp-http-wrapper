name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install repository Rust toolchain and components
        run: rustup show active-toolchain
      - run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: python scripts/ci.py check
      - run: python scripts/ci.py release

      - name: Verify and exercise official Linux onefile
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-linux-smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - run: >
          bash scripts/ci-container.sh
          --cache-from=type=gha
          --cache-to=type=gha,mode=max
